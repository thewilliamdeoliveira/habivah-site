<style>body{margin:0;font-family:Manrope,system-ui,sans-serif;background:#F5F8FB;color:#0B1F3A;display:grid;place-items:center;min-height:100vh}.b{max-width:420px;margin:16px;background:#fff;padding:32px;border-radius:24px;box-shadow:0 10px 40px -15px rgba(11,31,58,.35);text-align:center}h1{color:#0B1F3A;font-size:24px;font-weight:800;letter-spacing:-.03em;margin:0 0 10px}p{color:#5B6577}a{color:#0B1F3A;font-weight:600;text-decoration-color:#10B981;text-underline-offset:3px}.lg{display:block;margin:0 auto 20px;height:28px;width:auto}</style></head>
<body><div class="b"><img class="lg" src="/assets/brand/logo.svg" alt="habivah" width="128" height="28"><h1 id="t">Cancelando…</h1><p id="m">Só um instante.</p><p><a href="/">Voltar ao site</a></p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(async function(){
 var t=new URLSearchParams(location.search).get("t"),T=document.getElementById("t"),M=document.getElementById("m");
 if(!/^[0-9a-f-]{36}$/i.test(t||"")){T.textContent="Link inválido";M.textContent="Para sair da lista, responda qualquer e-mail nosso pedindo o cancelamento.";return;}
 var db=supabase.createClient("https://rzsotlrmjrkslsltnntg.supabase.co","sb_publishable_smEE1n3Srugt98xxmNZ_4g_q5A_0ddN");
 var r=await db.rpc("habivah_descadastrar",{t:t});
 if(r.error||!r.data){T.textContent="Não foi possível cancelar";M.textContent="Responda qualquer e-mail nosso pedindo o cancelamento e resolvemos.";return;}
 T.textContent="Inscrição cancelada";M.textContent="Você não receberá mais as novidades do Habivah por e-mail.";
})();
</script></body></html>
